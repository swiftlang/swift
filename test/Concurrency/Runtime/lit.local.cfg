import os

config.substitutions = list(config.substitutions)


def escape_for_substitute_captures(value):
  return value.replace("\\", "\\\\")

module_triple = next(
    (value for substitution, value in config.substitutions
     if substitution == "%module-target-triple"),
    None)

is_darwin = "OS_FAMILY=darwin" in config.available_features
is_linux = "OS_FAMILY=linux" in config.available_features

if (module_triple
    and "embedded_stdlib" in config.available_features
    and "swift_embedded_platform" in config.available_features
    and "optimized_stdlib" in config.available_features
    and (is_darwin or is_linux)):
  embedded_lib_dir = os.path.join(
      config.swift_obj_root, "lib", "swift", "embedded", module_triple)
  target_triple = f"{module_triple}14" if is_darwin else module_triple
  threading_archive = os.path.join(
      embedded_lib_dir,
      ("libswiftEmbeddedPlatformMultiThreadedDarwin.a" if is_darwin else
       "libswiftEmbeddedPlatformMultiThreadedPOSIX.a"))

  common_archives = [
      os.path.join(embedded_lib_dir, "libswiftCore.a"),
      os.path.join(embedded_lib_dir, "libswiftEmbeddedPlatformPOSIX.a"),
      os.path.join(embedded_lib_dir, "libswift_Concurrency.a"),
  ]

  def add_embedded_executor_test(name, executor_archive, extra_link_parts=()):
    embedded_archives = [*common_archives, executor_archive, threading_archive]
    if not all(os.path.exists(path) for path in embedded_archives):
      return

    config.available_features.add(f"embedded_{name}_executor")
    if is_darwin:
      link_parts = embedded_archives
    else:
      link_parts = [
          "-Wl,--gc-sections",
          "-Wl,--start-group",
          *embedded_archives,
          "-Wl,--end-group",
          *extra_link_parts,
          "-pthread",
          "-ldl",
      ]

    run_embedded_swift = SubstituteCaptures(
        rf'%%empty-directory(%%t.embedded-{name}) && '
        r'%%target-swift-frontend -target %s '
        r'-enable-experimental-feature Embedded '
        r'-disable-availability-checking -parse-as-library -wmo '
        rf'\1 %%s -c -o %%t.embedded-{name}/a.o && '
        r'%%target-clang -target %s %%target-clang-resource-dir-opt '
        rf'%%t.embedded-{name}/a.o -o %%t.embedded-{name}/a.out %s '
        r'%%target-swift-dead-strip-opt && '
        rf'%%target-run %%t.embedded-{name}/a.out'
        % (escape_for_substitute_captures(target_triple),
           escape_for_substitute_captures(target_triple),
           escape_for_substitute_captures(" ".join(link_parts))))
    config.substitutions.insert(0, (
        rf'%target-run-embedded-{name}-swift\(([^)]*)\)',
        run_embedded_swift))

  add_embedded_executor_test(
      "cooperative",
      os.path.join(embedded_lib_dir,
                   "libswift_ConcurrencyDefaultExecutor.a"))

  if ("libdispatch" in config.available_features
      and hasattr(config, "libdispatch_artifact_dir")):
    add_embedded_executor_test(
        "dispatch",
        os.path.join(embedded_lib_dir,
                     "libswift_ConcurrencyDispatchExecutor.a"),
        [
            f"-L {config.libdispatch_artifact_dir}",
            "-ldispatch",
            "-lBlocksRuntime",
        ])
