# -*- Python -*- vim: set ft=python ts=4 sw=4 expandtab tw=79:

# Compares SARIF output read from stdin against a reference file.
# Paths are rewritten by %PathSanitizingDiff to TMP_DIR, SOURCE_DIR, and BUILD_DIR.
# The compiler version varies between builds and is rewritten to SWIFT_VERSION.
# The SARIF version is stable, so it is checked as-is.
#
# lit applies substitutions in list order. So this entry is inserted first to
# ensure that %PathSanitizingDiff obtained on expanding %sarif-diff is further
# expanded.
config.substitutions.insert(
    0,
    (
        "%sarif-diff",
        "%PathSanitizingDiff -U1 -b "
        # "Swift version 6.5-dev (...)" -> "SWIFT_VERSION"
        """--sanitize-regex 'SWIFT_VERSION=Swift version [^"]*'""",
    ),
)
