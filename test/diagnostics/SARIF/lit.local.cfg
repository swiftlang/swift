# -*- Python -*- vim: set ft=python ts=4 sw=4 expandtab tw=79:

# Filtering command for testing SARIF output against reference output, as in
# clang/test/Analysis/lit.local.cfg. Rewrites the values that vary between
# checkouts and builds -- the directory an artifact lives in, and the compiler
# version -- rather than dropping the lines that hold them, so that the artifact
# a diagnostic is attributed to is still covered and the reference files stay
# valid JSON. The SARIF version is stable, so it is checked as-is.
config.substitutions.append(
    (
        "%normalize_sarif",
        "sed -E "
        # "file:///path/to/tmp/x.swift" -> "file:///TEST_DIR/x.swift"
        + """-e 's@("uri" : "file://)[^"]*/([^/"]+)"@\\1/TEST_DIR/\\2"@' """
        # "Swift version 6.5-dev (...)" -> "Swift version SWIFT_VERSION"
        + """-e 's@("version" : ")Swift version [^"]*"@\\1Swift version SWIFT_VERSION"@'""",
    )
)
